name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate static entry
        run: test -s pages/index.html && test -s pages/styles.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static project homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
